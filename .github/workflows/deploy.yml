name: Deploy wiki-kof

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/entersysmx/wiki-kof
  CONTAINER: wiki-kof

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker image
        run: docker build -t $IMAGE:latest .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        run: docker push $IMAGE:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker stop ${{ env.CONTAINER }} 2>/dev/null || true
            docker rm   ${{ env.CONTAINER }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.CONTAINER }} \
              --network traefik_net \
              --restart unless-stopped \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.wiki-kof.rule=Host(\`wiki.entersys.mx\`) && PathPrefix(\`/es/kof\`)" \
              --label "traefik.http.routers.wiki-kof.entrypoints=websecure" \
              --label "traefik.http.routers.wiki-kof.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.wiki-kof.loadbalancer.server.port=80" \
              ${{ env.IMAGE }}:latest

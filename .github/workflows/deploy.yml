name: Deploy wiki-kof

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted

    steps:
      - name: Deploy frontend
        run: |
          set -e
          git -C /srv/wiki-kof fetch origin main
          git -C /srv/wiki-kof reset --hard origin/main
          docker build -t wiki-kof:latest /srv/wiki-kof
          docker stop wiki-kof 2>/dev/null || true
          docker rm   wiki-kof 2>/dev/null || true
          docker run -d \
            --name wiki-kof \
            --network traefik \
            --restart unless-stopped \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.wiki-kof.rule=Host(\`wiki.entersys.mx\`) && PathPrefix(\`/es/kof\`)" \
            --label "traefik.http.routers.wiki-kof.entrypoints=websecure" \
            --label "traefik.http.routers.wiki-kof.tls.certresolver=letsencrypt" \
            --label "traefik.http.routers.wiki-kof.middlewares=wiki-kof-strip" \
            --label "traefik.http.middlewares.wiki-kof-strip.stripprefix.prefixes=/es/kof" \
            --label "traefik.http.services.wiki-kof.loadbalancer.server.port=80" \
            wiki-kof:latest

      - name: Deploy mascot API
        run: |
          set -e
          docker build -t kof-mascot-api:latest /srv/wiki-kof/kof-api
          docker stop kof-mascot-api 2>/dev/null || true
          docker rm   kof-mascot-api 2>/dev/null || true
          docker run -d \
            --name kof-mascot-api \
            --network traefik \
            --restart unless-stopped \
            --env-file /srv/wiki-kof/kof-api/.env \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.kof-mascot-api.rule=Host(\`wiki.entersys.mx\`) && PathPrefix(\`/kof-api\`)" \
            --label "traefik.http.routers.kof-mascot-api.entrypoints=websecure" \
            --label "traefik.http.routers.kof-mascot-api.tls.certresolver=letsencrypt" \
            --label "traefik.http.routers.kof-mascot-api.middlewares=kof-mascot-strip" \
            --label "traefik.http.middlewares.kof-mascot-strip.stripprefix.prefixes=/kof-api" \
            --label "traefik.http.services.kof-mascot-api.loadbalancer.server.port=3100" \
            kof-mascot-api:latest
          docker image prune -f
